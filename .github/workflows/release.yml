name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar deps e buildar o frontend
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Sincronizar bundle web pro Electron
        working-directory: app
        run: npx cap copy electron

      - name: Instalar deps do Electron
        working-directory: app/electron
        run: npm install

      - name: Buildar o processo principal do Electron
        working-directory: app/electron
        run: npm run build

      - name: Empacotar app
        working-directory: app/electron
        run: npx electron-builder build -c ./electron-builder.config.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.os }}
          path: |
            app/electron/dist/*.AppImage
            app/electron/dist/*.deb
            app/electron/dist/*.dmg
            app/electron/dist/*.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
